[project]
name = "cs-agent"
version = "0.1.0"
description = "LangChain/LangGraph customer service agent for a demo electronics store"
authors = [
    { name = "caijicheng", email = "richardcai1029@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography>=50.0.2",
    "dashscope>=1.27.7",
    "fastapi>=0.143.2",
    "langchain>=1.0",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "pypdf>=6.20.1",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=3.1.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cs-agent = "cs_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
