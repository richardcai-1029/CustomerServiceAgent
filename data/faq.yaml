# Frequently asked questions served by the zero-LLM fast path.
# Keep entries policy-style and generic: anything that needs the customer's own
# data (e.g. "where is my order") must NOT be an FAQ, so it reaches the agent.
- id: return-policy
  question: What is your return policy?
  variants:
    - How do returns work?
    - Can I return an item?
    - How many days do I have to return something?
    - What is the return window?
    - return policy
  answer: >-
    You can return most items within 7 days of delivery for a full refund, as long as
    they are in their original condition with all accessories. Faulty items outside the
    return window are covered by our 1-year limited warranty. To start a return, just
    tell me "I want to return an item" and I'll guide you through it.

- id: refund-time
  question: How long does a refund take?
  variants:
    - How long do refunds take to arrive?
    - How fast are refunds processed?
  answer: >-
    Refunds to your store account balance are instant once approved. Refunds to a card
    usually arrive within 3-5 business days. For returns, the refund is issued after we
    receive and inspect the item (typically 1-2 business days after it reaches us).

- id: business-hours
  question: What are your customer service hours?
  variants:
    - What are your business hours?
    - When are you open?
    - When is customer support available?
    - opening hours
    - Are you open on weekends?
  answer: >-
    This virtual assistant is available 24/7. Our human support team is available
    Monday-Friday 8:00-20:00 and Saturday-Sunday 9:00-18:00 (Pacific Time). Our
    retail stores open daily from 10:00 to 21:00.

- id: shipping-time
  question: How long does shipping take?
  variants:
    - How long does delivery take?
    - When will my order arrive after I place it?
    - What are your delivery times?
    - delivery time
  answer: >-
    Standard shipping takes 3-5 business days and express shipping takes 1-2 business
    days. Orders placed before 2 PM Pacific Time on a business day ship the same day.

- id: shipping-cost
  question: How much does shipping cost?
  variants:
    - Is shipping free?
    - Do you offer free shipping?
    - What are the shipping fees?
  answer: >-
    Standard shipping is free on orders over $50; otherwise it costs $5.99. Express
    shipping costs $14.99 on any order.

- id: international-shipping
  question: Do you ship internationally?
  variants:
    - Can you ship to another country?
    - Do you deliver outside the US?
    - international delivery
  answer: >-
    We currently ship only within the United States, including Alaska and Hawaii. We do
    not ship to PO boxes for orders over $500.

- id: payment-methods
  question: What payment methods do you accept?
  variants:
    - Which payment methods can I use?
    - Can I pay with PayPal?
    - Do you accept credit cards?
    - How can I pay?
  answer: >-
    We accept Visa, Mastercard, American Express, PayPal, Apple Pay and your NovaTech
    store account balance. Payment must be completed within 30 minutes of placing an
    order, or the order is cancelled automatically.

- id: warranty
  question: What warranty do your products have?
  variants:
    - How long is the warranty?
    - Is there a warranty on your products?
    - warranty policy
    - Does the warranty cover accidental damage?
  answer: >-
    All NovaTech-brand products include a 1-year limited warranty covering manufacturing
    defects; NovaBook laptops are covered for 2 years. Accidental damage, liquid damage
    and normal wear are not covered. You can book an in-store repair through me.

- id: price-match
  question: Do you offer price matching?
  variants:
    - Will you match a lower price?
    - Do you price match?
    - price protection
  answer: >-
    Yes. If the price of an item you bought drops on our store within 14 days of
    purchase, we refund the difference to your account balance. We do not match other
    retailers' prices.

- id: student-discount
  question: Do you have a student discount?
  variants:
    - Is there a student discount?
    - Student pricing?
    - education discount
  answer: >-
    Students and teachers get 10% off NovaBook and NovaPad devices after verifying their
    status with a school email address on our Education Store page.

- id: invoice
  question: How do I get an invoice?
  variants:
    - Can I get a receipt for my order?
    - Where can I download my invoice?
    - I need a VAT invoice
  answer: >-
    Invoices are emailed automatically when an order ships. You can also download them
    any time from Account > Orders > View invoice on our website.

- id: gift-cards
  question: Do you sell gift cards?
  variants:
    - Can I buy a gift card?
    - How do gift cards work?
  answer: >-
    Yes, digital gift cards from $25 to $500 are available on our website. They never
    expire and are added to the recipient's store account balance when redeemed.

- id: contact-human
  question: How can I contact customer service by phone or email?
  variants:
    - What is your phone number?
    - What is your support email?
    - How do I contact you?
  answer: >-
    You can call us at 1-800-555-0199 during support hours or email
    support@novatech.example. You can also simply ask me to transfer you to a human agent.

- id: store-locations
  question: Where are your stores?
  variants:
    - Do you have physical stores?
    - store locations
    - Where is the nearest store?
  answer: >-
    We have retail stores in San Francisco (Union Square), Austin (Domain), Seattle
    (Pike Place) and New York (SoHo). All stores offer in-store repair and pickup.
